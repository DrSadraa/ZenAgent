<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenChain Agent</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <h1 class="highlight">ZENCHAIN</h1>
    <p>Loading...</p>
  </div>

  <!-- Main app -->
  <div id="app" style="display: none;">
    <header>
      <h1>ZenChain Agent</h1>
      <p>Blockchain-powered AI Assistant</p>
      <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js" type="text/javascript"></script>
    </header>

<!-- Wallet and Balance -->
<section class="wallet">
  <button id="connectBtn">Connect Wallet</button>
 
</section>

<main>
  <!-- Chatbox -->
  <section class="chatbox">
    <h2>AI Chat</h2>
    <div id="messages"></div>
    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type your message...">
      <button id="sendBtn">Send</button>
    </div>
  </section>

  <!-- Transactions -->
  <section class="transactions">
    <h2>Transactions</h2>
    <ul id="txList"></ul>
  </section>
</main>  </div>

  <!-- External JS -->
  <script src="script.js"></script>
</body>
</html>
